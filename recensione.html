<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Casalaggiù · Recensione</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#14233a;--muted:#5b6676;--line:#dfe1dc;--sun:#e0a12a;--ionio:#138a86;--busyink:#8b3d2c;--terra:#c66a3d;--wa:#1f9d55;
--f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--surface:#16212f;--ink:#eef1f4;--muted:#9aa6b4;--line:#273444;--sun:#f0b84a;--ionio:#3fc1bb;--busyink:#f0a490;--terra:#f0a77c;--wa:#2fbf6c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding:24px 16px 60px}
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
.head{text-align:center;display:grid;gap:8px}
.mark{width:72px;height:64px;margin:0 auto;color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--terra)}
.rainbow{height:3px;width:120px;margin:4px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--terra),var(--sun),var(--ionio))}
.langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;display:flex;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:14px;margin:0}
.hello{font-family:var(--f-display);font-size:22px;margin:0;text-align:center}
.stay{font-family:var(--f-mono);font-weight:600;text-align:center;font-size:14px;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;background:var(--sun);color:#1b1404;border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.big{width:100%;justify-content:center;font-size:17px;padding:14px 22px}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
.err{color:var(--busyink);font-weight:600;margin:0;text-align:center}
.foot{text-align:center}.foot a{color:inherit}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{font-size:40px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:2px 4px;min-width:48px;min-height:48px}
.stars button.on{color:var(--sun)}
.stars button:focus-visible{outline:2px solid var(--sun);border-radius:8px}
.slbl{text-align:center;font-weight:600;min-height:1.5em;margin:0}
textarea,input.nm{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink)}
textarea{min-height:150px;resize:vertical}
textarea:focus,input.nm:focus{outline:2px solid var(--sun);outline-offset:1px}
.cnt{font-size:12px;color:var(--muted);text-align:right;font-weight:400}
.thanks{text-align:center;display:grid;gap:10px}
.thanks .big{font-size:44px;line-height:1}
.quote{border-left:3px solid var(--sun);padding:4px 0 4px 12px;margin:0;white-space:pre-wrap;text-align:left;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="head">
    <svg class="mark" viewBox="34 48 142 126" aria-hidden="true"><defs><radialGradient id="hg"><stop offset="0" stop-color="#efab2e" stop-opacity=".55"/><stop offset="1" stop-color="#efab2e" stop-opacity="0"/></radialGradient></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M52 170V62H80V170M47 62H85" stroke="#c66a3d" stroke-width="3.30"/><path d="M80 84H156V170" stroke="#c66a3d" stroke-width="3.30"/><path d="M84 84V74H154V84M98 84V74M112 84V74M126 84V74M140 84V74M154 74V56" stroke="currentColor" stroke-width="2.25"/><path d="M66 56Q87 78 109 64Q131 80 154 58" stroke="currentColor" stroke-width="1.50" opacity=".55"/><rect x="94" y="102" width="14" height="20" rx="1" fill="#efab2e" fill-opacity=".35" stroke="currentColor" stroke-width="2.40"/><path d="M101 102v20M94 112h14" stroke="currentColor" stroke-width="1.80"/><rect x="125" y="98" width="16" height="27" rx="1" stroke="currentColor" stroke-width="2.40"/><path d="M133 98v27M120 125h26M120 135h26M120 125v10M146 125v10M125 125v10M130 125v10M135 125v10M140 125v10" stroke="currentColor" stroke-width="1.80"/><path d="M106 170v-18a12 12 0 0 1 24 0v18" stroke="currentColor" stroke-width="2.70"/><path d="M85 170V145H96V170" stroke="currentColor" stroke-width="2.40"/><path d="M118 152v18" stroke="currentColor" stroke-width="1.50"/><path d="M36 170H172" stroke="currentColor" stroke-width="2.40"/></g><circle cx="74.4" cy="63.4" r="6" fill="url(#hg)"/><circle cx="83.0" cy="67.8" r="6" fill="url(#hg)"/><circle cx="91.6" cy="69.4" r="6" fill="url(#hg)"/><circle cx="100.2" cy="68.2" r="6" fill="url(#hg)"/><circle cx="117.8" cy="68.9" r="6" fill="url(#hg)"/><circle cx="126.8" cy="70.7" r="6" fill="url(#hg)"/><circle cx="135.8" cy="69.5" r="6" fill="url(#hg)"/><circle cx="144.8" cy="65.3" r="6" fill="url(#hg)"/><circle cx="74.4" cy="63.4" r="2.3" fill="#efab2e"/><circle cx="83.0" cy="67.8" r="2.3" fill="#efab2e"/><circle cx="91.6" cy="69.4" r="2.3" fill="#efab2e"/><circle cx="100.2" cy="68.2" r="2.3" fill="#efab2e"/><circle cx="117.8" cy="68.9" r="2.3" fill="#efab2e"/><circle cx="126.8" cy="70.7" r="2.3" fill="#efab2e"/><circle cx="135.8" cy="69.5" r="2.3" fill="#efab2e"/><circle cx="144.8" cy="65.3" r="2.3" fill="#efab2e"/></svg>
    <h1 data-i="title"></h1>
    <div class="sub">Casalaggiù · Cutrofiano</div>
    <div class="rainbow"></div>
    <div class="langs" id="langs"></div>
  </div>
  <p id="loading" class="muted" style="text-align:center" data-i="loading"></p>
  <div class="card" id="fail" hidden><p class="err" id="failmsg"></p></div>
  <form class="card" id="f" hidden novalidate>
    <p class="hello" id="hello"></p>
    <div class="stay" id="stay"></div>
    <p class="muted" style="text-align:center" data-i="intro"></p>
    <div class="stars" id="stars" role="radiogroup"></div>
    <p class="slbl" id="slbl"></p>
    <label><span data-i="txtL"></span><textarea id="txt" maxlength="1500"></textarea><span class="cnt" id="cnt">0 / 1500</span></label>
    <label><span data-i="nmL"></span><input class="nm" id="nm" maxlength="40" autocomplete="given-name"></label>
    <p class="muted" data-i="note"></p>
    <p class="err" id="msg" hidden></p>
    <button class="btn big" id="go" type="submit" data-i="send"></button>
  </form>
  <div class="card thanks" id="ok" hidden>
    <div class="big">💛</div>
    <p class="hello" data-i="thx"></p>
    <p class="muted" data-i="thx2"></p>
    <blockquote class="quote" id="mine" hidden></blockquote>
    <a class="btn big" href="https://casalaggiu.it/" data-i="home"></a>
  </div>
  <p class="foot muted"><a href="https://casalaggiu.it/">casalaggiu.it</a></p>
</main>
<script>
const API="https://casalaggiu.maurizio-covarelli.workers.dev/api";
const LANGS=["it","en","de","nl","es","fr"];
const T={
it:{title:"La tua recensione",loading:"Caricamento…",hello:n=>`Ciao ${n}, com'è andata?`,intro:"Quante stelle dai al tuo soggiorno?",S:["Pessimo","Così così","Buono","Molto buono","Eccellente"],txtL:"Raccontaci il tuo soggiorno",nmL:"Nome da mostrare",note:"La recensione comparirà sul sito dopo una nostra verifica. Non pubblichiamo email né cognomi.",send:"Invia la recensione",eS:"Scegli da 1 a 5 stelle.",eT:"Scrivi almeno qualche parola (10 caratteri).",eN:"Invio non riuscito: controlla la connessione e riprova.",thx:"Grazie di cuore!",thx2:"Abbiamo ricevuto la tua recensione: la pubblicheremo presto sul sito.",already:"Hai già lasciato una recensione per questo soggiorno. Grazie!",home:"Torna al sito",notfound:"Link non valido. Scrivici e ti mandiamo quello giusto.",early:"Potrai lasciare la recensione dal giorno prima della partenza.",expired:"Il tempo per lasciare la recensione è scaduto. Grazie comunque!"},
en:{title:"Your review",loading:"Loading…",hello:n=>`Hi ${n}, how was it?`,intro:"How many stars would you give your stay?",S:["Terrible","So-so","Good","Very good","Excellent"],txtL:"Tell us about your stay",nmL:"Name to display",note:"Your review will appear on the website after we check it. We never publish emails or surnames.",send:"Send review",eS:"Choose from 1 to 5 stars.",eT:"Please write at least a few words (10 characters).",eN:"Couldn't send it: check your connection and try again.",thx:"Thank you so much!",thx2:"We received your review and will publish it on the website soon.",already:"You have already left a review for this stay. Thank you!",home:"Back to the website",notfound:"Invalid link. Write to us and we'll send you the right one.",early:"You can leave your review from the day before departure.",expired:"The time to leave a review has passed. Thank you anyway!"},
de:{title:"Deine Bewertung",loading:"Wird geladen…",hello:n=>`Hallo ${n}, wie war es?`,intro:"Wie viele Sterne gibst du deinem Aufenthalt?",S:["Schlecht","Na ja","Gut","Sehr gut","Hervorragend"],txtL:"Erzähl uns von deinem Aufenthalt",nmL:"Angezeigter Name",note:"Deine Bewertung erscheint nach unserer Prüfung auf der Website. E-Mails und Nachnamen veröffentlichen wir nie.",send:"Bewertung senden",eS:"Wähle 1 bis 5 Sterne.",eT:"Schreib bitte ein paar Worte (mindestens 10 Zeichen).",eN:"Senden fehlgeschlagen: prüfe die Verbindung und versuche es erneut.",thx:"Herzlichen Dank!",thx2:"Wir haben deine Bewertung erhalten und veröffentlichen sie bald auf der Website.",already:"Du hast für diesen Aufenthalt schon eine Bewertung abgegeben. Danke!",home:"Zur Website",notfound:"Ungültiger Link. Schreib uns, wir schicken dir den richtigen.",early:"Du kannst ab dem Tag vor der Abreise bewerten.",expired:"Die Zeit für eine Bewertung ist abgelaufen. Trotzdem danke!"},
nl:{title:"Jouw review",loading:"Laden…",hello:n=>`Hoi ${n}, hoe was het?`,intro:"Hoeveel sterren geef je je verblijf?",S:["Slecht","Matig","Goed","Heel goed","Uitstekend"],txtL:"Vertel ons over je verblijf",nmL:"Naam die we tonen",note:"Je review verschijnt op de website nadat we hem hebben bekeken. We publiceren nooit e-mailadressen of achternamen.",send:"Review versturen",eS:"Kies 1 tot 5 sterren.",eT:"Schrijf minstens een paar woorden (10 tekens).",eN:"Versturen mislukt: controleer je verbinding en probeer opnieuw.",thx:"Hartelijk dank!",thx2:"We hebben je review ontvangen en zetten hem binnenkort op de website.",already:"Je hebt al een review voor dit verblijf achtergelaten. Dank je!",home:"Naar de website",notfound:"Ongeldige link. Stuur ons een bericht, dan sturen we de juiste.",early:"Je kunt een review achterlaten vanaf de dag voor vertrek.",expired:"De tijd voor een review is verlopen. Toch bedankt!"},
es:{title:"Tu reseña",loading:"Cargando…",hello:n=>`Hola ${n}, ¿qué tal fue?`,intro:"¿Cuántas estrellas le das a tu estancia?",S:["Pésima","Regular","Buena","Muy buena","Excelente"],txtL:"Cuéntanos tu estancia",nmL:"Nombre que se mostrará",note:"Tu reseña aparecerá en la web después de que la revisemos. Nunca publicamos correos ni apellidos.",send:"Enviar reseña",eS:"Elige de 1 a 5 estrellas.",eT:"Escribe al menos unas palabras (10 caracteres).",eN:"No se pudo enviar: comprueba la conexión y vuelve a intentarlo.",thx:"¡Muchísimas gracias!",thx2:"Hemos recibido tu reseña y pronto la publicaremos en la web.",already:"Ya has dejado una reseña para esta estancia. ¡Gracias!",home:"Volver a la web",notfound:"Enlace no válido. Escríbenos y te enviamos el correcto.",early:"Podrás dejar la reseña desde el día antes de la salida.",expired:"El plazo para dejar la reseña ha terminado. ¡Gracias de todos modos!"},
fr:{title:"Votre avis",loading:"Chargement…",hello:n=>`Bonjour ${n}, comment ça s'est passé ?`,intro:"Combien d'étoiles donnez-vous à votre séjour ?",S:["Très mauvais","Moyen","Bien","Très bien","Excellent"],txtL:"Racontez-nous votre séjour",nmL:"Nom affiché",note:"Votre avis apparaîtra sur le site après vérification. Nous ne publions jamais d'e-mail ni de nom de famille.",send:"Envoyer l'avis",eS:"Choisissez de 1 à 5 étoiles.",eT:"Écrivez au moins quelques mots (10 caractères).",eN:"Envoi impossible : vérifiez la connexion et réessayez.",thx:"Merci infiniment !",thx2:"Nous avons bien reçu votre avis et le publierons bientôt sur le site.",already:"Vous avez déjà laissé un avis pour ce séjour. Merci !",home:"Retour au site",notfound:"Lien non valide. Écrivez-nous et nous vous enverrons le bon.",early:"Vous pourrez laisser votre avis à partir de la veille du départ.",expired:"Le délai pour laisser un avis est dépassé. Merci quand même !"}
};
const P=new URLSearchParams(location.search),$=id=>document.getElementById(id),tok=P.get("t")||"";
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=(()=>{const q=P.get("l");if(LANGS.includes(q))return q;const s=st.get("cdm_lang");if(LANGS.includes(s))return s;const n=(navigator.language||"it").slice(0,2);return LANGS.includes(n)?n:"it"})();
let D=null,FAIL=null,stelle=0,DONE=null,langSet=!!(P.get("l")||st.get("cdm_lang"));
const t=k=>(T[lang]&&T[lang][k])??T.it[k];
const loc=()=>lang==="en"?"en-GB":lang;
const fd=x=>new Date(x+"T12:00:00").toLocaleDateString(loc(),{day:"numeric",month:"long",year:"numeric"});
function render(){
  document.documentElement.lang=lang;document.title="Casalaggiù · "+t("title");
  document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));
  const L=$("langs");L.innerHTML="";LANGS.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c.toUpperCase();b.setAttribute("aria-pressed",String(c===lang));b.onclick=()=>{lang=c;st.set("cdm_lang",c);render()};L.append(b)});
  if(FAIL){$("failmsg").textContent=t(FAIL)}
  if(FAIL==="already")$("ok").querySelector("[data-i=thx2]").textContent=t("already");
  if(D){$("hello").textContent=t("hello")(D.nome||"");$("stay").textContent=fd(D.arrivo)+" → "+fd(D.partenza);if(!$("nm").value)$("nm").value=D.nome||""}
  const S=$("stars");S.innerHTML="";for(let i=1;i<=5;i++){const b=document.createElement("button");b.type="button";b.textContent="★";b.className=i<=stelle?"on":"";b.setAttribute("role","radio");b.setAttribute("aria-checked",String(i===stelle));b.setAttribute("aria-label",i+" – "+t("S")[i-1]);b.onclick=()=>{stelle=i;render()};S.append(b)}
  $("slbl").textContent=stelle?t("S")[stelle-1]:"";
  if(DONE){$("mine").hidden=false;$("mine").textContent="★".repeat(DONE.stelle)+"\n"+DONE.testo}
}
function show(id){["loading","fail","f","ok"].forEach(x=>$(x).hidden=x!==id)}
$("txt").addEventListener("input",()=>{$("cnt").textContent=$("txt").value.length+" / 1500"});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();const m=$("msg");m.hidden=true;
  const testo=$("txt").value.trim();
  if(!stelle){m.textContent=t("eS");m.hidden=false;return}
  if(testo.length<10){m.textContent=t("eT");m.hidden=false;return}
  $("go").disabled=true;
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"recensione",t:tok,stelle,testo,nome:$("nm").value.trim(),lingua:lang})});const d=await r.json();
    if(d.ok){DONE={stelle,testo};render();show("ok");scrollTo(0,0)}
    else if(d.errore==="gia"){FAIL="already";render();show("fail")}
    else{m.textContent=d.errore==="testo"?t("eT"):d.errore==="stelle"?t("eS"):t("eN");m.hidden=false}
  }catch(err){m.textContent=t("eN");m.hidden=false}
  $("go").disabled=false;
});
(async()=>{
  render();
  if(!/^[a-f0-9]{16}$/.test(tok)){FAIL="notfound";render();show("fail");return}
  try{const d=await (await fetch(API+"?action=recensione&t="+tok)).json();
    if(!d.ok){FAIL="notfound";render();show("fail");return}
    if(!langSet&&LANGS.includes(d.lingua))lang=d.lingua;
    D=d;
    if(d.gia){FAIL="already";DONE=d.gia;render();show("ok");return}
    if(d.presto){FAIL="early";render();show("fail");return}
    if(d.scaduto){FAIL="expired";render();show("fail");return}
    render();show("f");
  }catch(e){FAIL="eN";render();show("fail")}
})();
</script>
</body>
</html>
