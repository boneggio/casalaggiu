<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#14233a;--muted:#5b6676;--line:#dfe1dc;--sun:#e0a12a;--ionio:#138a86;--busyink:#8b3d2c;--terra:#c66a3d;--wa:#1f9d55;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--surface:#16212f;--ink:#eef1f4;--muted:#9aa6b4;--line:#273444;--sun:#f0b84a;--ionio:#3fc1bb;--busyink:#f0a490;--terra:#f0a77c;--wa:#2fbf6c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding:24px 16px 60px}
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
.head{text-align:center;display:grid;gap:8px}
.mark{width:72px;height:64px;margin:0 auto;color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--terra) 78%,var(--ink))}
.rainbow{height:3px;width:120px;margin:4px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--terra),var(--sun),var(--ionio))}
.langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;display:flex;gap:10px;align-items:center}
.card h2 .ico{font-size:22px;line-height:1}
.muted{color:var(--muted);font-size:14px;margin:0}
.hello{font-family:var(--f-display);font-size:22px;margin:0;text-align:center}
.stay{font-family:var(--f-mono);font-weight:600;text-align:center;font-size:14px;color:var(--muted)}
.prev{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-color:var(--sun);text-align:center;font-weight:600;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:600px){.quick{grid-template-columns:1fr}}
.kv{display:grid;gap:2px}.kv span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:18px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;background:var(--sun);color:#1b1404;border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}.btn.tg{background:#2a9fd8;color:#fff}
.btn.big{width:100%;justify-content:center;font-size:17px;padding:14px 22px}
.qr{background:#fff;border-radius:12px;padding:10px;justify-self:center}.qr svg{display:block;width:180px;height:180px}
.chips{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;border-radius:999px;padding:6px 12px;white-space:nowrap}
.txt p{margin:0 0 10px}.txt p:last-child,.txt ul:last-child{margin-bottom:0}
.txt ul{margin:0 0 10px;padding-left:20px}.txt li{margin:2px 0}
.txt a{color:var(--ionio);word-break:break-word}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.links{grid-template-columns:1fr}}
.links a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;background:var(--bg)}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input{font:inherit;font-size:24px;letter-spacing:.3em;text-align:center;font-family:var(--f-mono);width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);min-height:52px}
input:focus{outline:2px solid var(--sun);outline-offset:1px}
.err{color:var(--busyink);font-weight:600;margin:0;text-align:center}
.foot{text-align:center}.foot a{color:inherit}
</style>
<style>
.objico{font-size:44px;line-height:1;text-align:center}
.rfh{border-radius:14px;padding:16px;display:grid;gap:10px;color:#fff;background:linear-gradient(135deg,var(--c1,#14233a),var(--c2,#2a3c58))}
.rfh.free{background:color-mix(in srgb,var(--ionio) 12%,var(--surface));color:var(--ink);border:1px dashed var(--line)}
.rfh .k{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.rfh .tiles{display:flex;gap:10px;flex-wrap:wrap}
.rfh .tile{display:flex;align-items:center;gap:10px;background:rgb(255 255 255 / .16);border:1px solid rgb(255 255 255 / .25);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:800}
.rfh .tile .e{font-size:28px;line-height:1}
.rfh .when{font-size:15px;font-weight:600;opacity:.95}
.rfh.free .big{font-size:18px;font-weight:700}
.rfnext{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rfw{display:grid;gap:8px}.rfw h3{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:20px}.rfw .s{font-size:13.5px;color:var(--muted);margin:-4px 0 2px}
.rfrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;border-radius:12px;padding:8px 10px;background:var(--bg)}
.rfrow.today{outline:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 10%,var(--surface))}
.rfrow .dd{display:grid;line-height:1.2}.rfrow .dd b{font-size:15px;text-transform:capitalize}.rfrow .dd small{font-size:12px;color:var(--muted)}
.rfrow .dd .tg{display:inline-block;width:max-content;font-size:11px;font-weight:800;background:var(--sun);color:#1b1404;border-radius:999px;padding:1px 7px;margin-top:2px;text-transform:uppercase}
.rfrow .what{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rfrow .pk{grid-column:2;font-size:12px;color:var(--muted);margin-top:-4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;color:#fff}
.pill .e{font-size:17px;line-height:1}
.pill.none{background:none;color:var(--muted);font-weight:600;padding-left:0}
.rf-now{display:grid;gap:10px}
.rf-day{display:grid;gap:6px}.rf-day b{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rf-chips{display:flex;gap:6px;flex-wrap:wrap}
.rf{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;color:#fff}
.rf.none{background:none;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.rf.big{font-size:18px;padding:9px 16px}
.rf-organico{background:#8a5a2b}.rf-plastica{background:#e3b21c;color:#1b1404}.rf-carta{background:#2f6fd0}.rf-vetro{background:#2e9a52}.rf-metalli{background:#5f9c86;color:#fff}.rf-secco{background:#6f7780}.rf-altro{background:#8b3d2c}
.rf-week{display:grid;gap:6px}.rf-week>div{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rf-week>div.today{font-weight:700}.rf-week span.d{font-size:14px;text-transform:capitalize}
.rf-week .rf{font-size:12.5px;padding:3px 9px}
.nota{font-size:14px;color:var(--muted);margin:0}
.edit{display:inline-flex;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;border:1px dashed var(--line);border-radius:999px;padding:4px 10px;justify-self:center}
</style>
</head>

const wd=d=>new Date(d+"T12:00:00Z").getUTCDay();
function tipiDi(r,d){const x=(r.eccezioni||[]).find(z=>z.d===d);return x?{tipi:x.tipi||[],nota:x.nota||""}:{tipi:(r.sere||{})[wd(d)]||[],nota:""}}
function chips(L,big){const c=el("div",{class:"rf-chips"});if(!L.length)c.append(el("span",{class:"rf none"+(big?" big":""),text:t("nothing")}));L.forEach(k=>c.append(el("span",{class:`rf rf-${k}${big?" big":""}`,text:t("R")[k]||k})));return c}
const RF_ICO={organico:"🍌",plastica:"🧴",carta:"📦",vetro:"🍾",metalli:"🥫",secco:"🗑️",altro:"❗"};
const RF_COL={organico:["#8a5a2b","#6b431d"],plastica:["#d9a514","#b5850a"],carta:["#2f6fd0","#1f55a8"],vetro:["#2e9a52","#1f7a3e"],metalli:["#5f9c86","#3f7b66"],secco:["#6f7780","#50575f"],altro:["#8b3d2c","#6b2c1f"]};
function pill(k){return el("span",{class:`pill rf-${k}`},el("span",{class:"e",text:RF_ICO[k]||"•"}),el("span",{text:t("R")[k]||k}))}
const dayName=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString(loc(),o||{weekday:"long"});
function rifiuti(r){const C=$("rfcard");C.innerHTML="";C.hidden=false;const d0=oggi();
  C.append(el("h2",{},el("span",{class:"ico",text:"♻️"}),el("span",{text:t("rfT")})));
  const a=tipiDi(r,d0);
  const when=r.ora?t("at")(r.ora):t("atDef");
  if(a.tipi.length){const c=RF_COL[a.tipi[0]]||RF_COL.altro;const H=el("div",{class:"rfh",style:`--c1:${c[0]};--c2:${(RF_COL[a.tipi[a.tipi.length-1]]||c)[1]}`});
    H.append(el("div",{class:"k",text:`${t("tonightK")} · ${dayName(d0)}`}));
    const T=el("div",{class:"tiles"});a.tipi.forEach(k=>T.append(el("div",{class:"tile"},el("span",{class:"e",text:RF_ICO[k]||"•"}),el("span",{text:t("R")[k]||k}))));H.append(T);
    H.append(el("div",{class:"when",text:"🕙 "+when}));if(a.nota)H.append(el("div",{class:"when",text:a.nota}));C.append(H)}
  else{const H=el("div",{class:"rfh free"},el("div",{class:"big",text:t("free")}));if(a.nota)H.append(el("div",{class:"nota",text:a.nota}));
    // prossima sera con qualcosa
    for(let n=1;n<=7;n++){const d=piu(d0,n),x=tipiDi(r,d);if(x.tipi.length){const N=el("div",{class:"rfnext"},el("b",{text:`${t("next")}: ${n===1?t("tomorrow").toLowerCase():dayName(d)+" "+t("eve")}`}));x.tipi.forEach(k=>N.append(pill(k)));H.append(N);break}}
    C.append(H)}
  const W=el("div",{class:"rfw"});W.append(el("h3",{text:t("weekT")}),el("p",{class:"s",text:t("weekS")}));
  for(let n=0;n<7;n++){const d=piu(d0,n),x=tipiDi(r,d),row=el("div",{class:"rfrow"+(n===0?" today":"")});
    const dd=el("div",{class:"dd"},el("b",{text:dayName(d)}),el("small",{text:t("eve")}));if(n===0)dd.append(el("span",{class:"tg",text:t("today")}));
    const w=el("div",{class:"what"});if(x.tipi.length)x.tipi.forEach(k=>w.append(pill(k)));else w.append(el("span",{class:"pill none",text:"— "+t("nothing")}));
    row.append(dd,w);if(x.tipi.length)row.append(el("div",{class:"pk",text:`${t("pick")}: ${dayName(piu(d,1))} ${new Date(piu(d,1)+"T12:00:00").toLocaleDateString(loc(),{day:"numeric",month:"short"})}`}));
    if(x.nota)row.append(el("div",{class:"pk",text:x.nota}));W.append(row)}
  C.append(W);
}
function render(){document.documentElement.lang=lang;
  const L=$("langs");L.innerHTML="";LANGS.forEach(c=>{const b=el("button",{type:"button","aria-pressed":String(c===lang),text:c.toUpperCase(),lang:c});b.onclick=()=>{lang=c;st.set("cdm_lang",c);render()};L.append(b)});
  document.querySelectorAll("[data-i]").forEach(e=>{const v=t(e.dataset.i);if(typeof v==="string")e.textContent=v});
  if(FAIL){$("loading").hidden=true;$("fail").hidden=false;$("failmsg").textContent=t(FAIL);return}
  if(!D)return;$("loading").hidden=true;$("g").hidden=false;
  const e=D.e,nome=pick(e.t);document.title=`${nome} · Casalaggiù`;
  $("ico").textContent=e.ico||"📌";$("nome").textContent=nome;
  const x=pick(e.x);$("tipcard").hidden=!x;$("tips").innerHTML=fmt(x);
  const K=$("links");K.innerHTML="";(e.links||[]).forEach(k=>K.append(el("a",{href:k.u,target:"_blank",rel:"noopener"},el("span",{text:"↗"}),el("span",{text:pick(k.n)||t("link")}))));$("lkcard").hidden=!(e.links||[]).length;
  if(D.rifiuti)rifiuti(D.rifiuti);else $("rfcard").hidden=true;
  $("gdcard").hidden=!D.guida;
  let adm=false;try{adm=!!localStorage.getItem("cl_tok")}catch(er){}
  const ed=$("edit");ed.hidden=!adm;ed.textContent="✏️ "+t("edit");ed.href="/admin.html#etichetta="+encodeURIComponent(e.id);
}
(async()=>{render();
  if(!tag){FAIL="notfound";render();return}
  try{const r=await fetch(API+"?action=etichetta&t="+encodeURIComponent(tag),{cache:"no-store"});const d=await r.json();if(!d.ok){FAIL="notfound";render();return}D=d;render()}
  catch(e){FAIL="net";render()}})();
</script>
</body>
