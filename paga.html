<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Casalaggiù · Pagamento</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#14233a;--muted:#5b6676;--line:#dfe1dc;--sun:#e0a12a;--ionio:#138a86;--busyink:#8b3d2c;--terra:#c66a3d;
--f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--surface:#16212f;--ink:#eef1f4;--muted:#9aa6b4;--line:#273444;--sun:#f0b84a;--ionio:#3fc1bb;--busyink:#f0a490;--terra:#f0a77c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:grid;gap:16px;text-align:center}
.mark{width:84px;height:74px;margin:0 auto;color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--terra);margin-top:-8px}
.amount{font-family:var(--f-mono);font-size:34px;font-weight:600}
.desc{color:var(--muted)}
.btn{display:block;font:inherit;font-weight:700;font-size:17px;border:0;background:var(--sun);color:#1b1404;border-radius:999px;padding:14px 20px;text-decoration:none;cursor:pointer}
.note{font-size:13px;color:var(--muted)}
.ok{color:var(--ionio);font-weight:700;font-size:20px}
.err{color:var(--busyink);font-weight:600}
.langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
a{color:inherit}
.or{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.14em;margin:4px 0}
.bank{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;text-align:left}
.bank h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-align:center}
.qr{display:flex;justify-content:center}.qr svg{width:200px;height:200px;border-radius:8px}
.bank dl{margin:0;display:grid;gap:8px}.bank dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.bank dd{margin:2px 0 0;word-break:break-word}
.mono{font-family:var(--f-mono)}
.cp{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;margin-left:4px}
</style>
</head>
<body>
<main class="box">
  <svg class="mark" viewBox="34 48 142 126" aria-hidden="true"><defs><radialGradient id="hg"><stop offset="0" stop-color="#efab2e" stop-opacity=".55"/><stop offset="1" stop-color="#efab2e" stop-opacity="0"/></radialGradient></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M52 170V62H80V170M47 62H85" stroke="#c66a3d" stroke-width="3.30"/><path d="M80 84H156V170" stroke="#c66a3d" stroke-width="3.30"/><path d="M84 84V74H154V84M98 84V74M112 84V74M126 84V74M140 84V74M154 74V56" stroke="currentColor" stroke-width="2.25"/><path d="M66 56Q87 78 109 64Q131 80 154 58" stroke="currentColor" stroke-width="1.50" opacity=".55"/><rect x="94" y="102" width="14" height="20" rx="1" fill="#efab2e" fill-opacity=".35" stroke="currentColor" stroke-width="2.40"/><path d="M101 102v20M94 112h14" stroke="currentColor" stroke-width="1.80"/><rect x="125" y="98" width="16" height="27" rx="1" stroke="currentColor" stroke-width="2.40"/><path d="M133 98v27M120 125h26M120 135h26M120 125v10M146 125v10M125 125v10M130 125v10M135 125v10M140 125v10" stroke="currentColor" stroke-width="1.80"/><path d="M106 170v-18a12 12 0 0 1 24 0v18" stroke="currentColor" stroke-width="2.70"/><path d="M85 170V145H96V170" stroke="currentColor" stroke-width="2.40"/><path d="M118 152v18" stroke="currentColor" stroke-width="1.50"/><path d="M36 170H172" stroke="currentColor" stroke-width="2.40"/></g><circle cx="74.4" cy="63.4" r="6" fill="url(#hg)"/><circle cx="83.0" cy="67.8" r="6" fill="url(#hg)"/><circle cx="91.6" cy="69.4" r="6" fill="url(#hg)"/><circle cx="100.2" cy="68.2" r="6" fill="url(#hg)"/><circle cx="117.8" cy="68.9" r="6" fill="url(#hg)"/><circle cx="126.8" cy="70.7" r="6" fill="url(#hg)"/><circle cx="135.8" cy="69.5" r="6" fill="url(#hg)"/><circle cx="144.8" cy="65.3" r="6" fill="url(#hg)"/><circle cx="74.4" cy="63.4" r="2.3" fill="#efab2e"/><circle cx="83.0" cy="67.8" r="2.3" fill="#efab2e"/><circle cx="91.6" cy="69.4" r="2.3" fill="#efab2e"/><circle cx="100.2" cy="68.2" r="2.3" fill="#efab2e"/><circle cx="117.8" cy="68.9" r="2.3" fill="#efab2e"/><circle cx="126.8" cy="70.7" r="2.3" fill="#efab2e"/><circle cx="135.8" cy="69.5" r="2.3" fill="#efab2e"/><circle cx="144.8" cy="65.3" r="2.3" fill="#efab2e"/></svg>
  <h1>Casalaggiù</h1>
  <div class="sub">Cutrofiano · Salento</div>
  <p id="loading" data-i="loading"></p>
  <div id="pay" hidden style="display:grid;gap:14px">
    <div class="desc" id="desc"></div>
    <div class="amount" id="amount"></div>
    <p class="err" id="retry" hidden data-i="notdone"></p>
    <div id="card" style="display:grid;gap:10px"><a class="btn" id="go" data-i="pay"></a>
    <p class="note" data-i="secure"></p></div>
    <p class="or" id="or" hidden data-i="or"></p>
    <section class="bank" id="bank" hidden>
      <h2 data-i="tr"></h2>
      <div class="qr" id="qr"></div>
      <p class="note" data-i="tr_scan"></p>
      <dl>
        <div><dt data-i="tr_holder"></dt><dd id="b_ben"></dd></div>
        <div><dt>IBAN</dt><dd><span class="mono" id="b_iban"></span> <button type="button" class="cp" data-c="b_iban" data-i="copy"></button></dd></div>
        <div><dt data-i="tr_amount"></dt><dd class="mono" id="b_imp"></dd></div>
        <div><dt data-i="tr_ref"></dt><dd><span id="b_cau"></span> <button type="button" class="cp" data-c="b_cau" data-i="copy"></button></dd></div>
      </dl>
      <p class="note" data-i="tr_note"></p>
    </section>
  </div>
  <div id="paid" hidden style="display:grid;gap:8px">
    <p class="ok" data-i="paid"></p>
    <p class="desc" id="paiddesc"></p>
    <p data-i="seeyou"></p>
  </div>
  <p class="err" id="error" hidden></p>
  <div class="langs" id="langs"></div>
  <p class="note"><a href="./" data-i="back"></a> · <a href="privacy.html" data-i="privacy"></a></p>
</main>
<script src="js/qr.js"></script>
<script>
const API="https://casalaggiu.maurizio-covarelli.workers.dev/api";
const T={
it:{or:"oppure",tr:"Bonifico bancario",tr_scan:"Inquadra il codice con l'app della tua banca: importo e causale sono già compilati.",tr_holder:"Intestatario",tr_amount:"Importo",tr_ref:"Causale",copy:"Copia",copied:"Copiato",tr_note:"Il bonifico può richiedere 1–2 giorni lavorativi: ti confermiamo noi quando lo riceviamo.",loading:"Caricamento…",pay:"Paga con carta",secure:"Il pagamento avviene sulla pagina sicura di SumUp: Casalaggiù non vede i dati della tua carta.",notdone:"Il pagamento non risulta ancora completato. Puoi riprovare.",paid:"Pagamento ricevuto. Grazie!",seeyou:"Ti aspettiamo a Casalaggiù.",notfound:"Questo link non è valido o è stato annullato. Scrivici e te ne mandiamo uno nuovo.",down:"Il servizio di pagamento non risponde. Riprova tra qualche minuto.",back:"Torna al sito",privacy:"Privacy"},
en:{or:"or",tr:"Bank transfer",tr_scan:"Scan the code with your banking app: amount and reference are already filled in.",tr_holder:"Account holder",tr_amount:"Amount",tr_ref:"Reference",copy:"Copy",copied:"Copied",tr_note:"A bank transfer can take 1–2 working days: we'll confirm when it arrives.",loading:"Loading…",pay:"Pay by card",secure:"Payment takes place on SumUp's secure page: Casalaggiù never sees your card details.",notdone:"The payment hasn't gone through yet. You can try again.",paid:"Payment received. Thank you!",seeyou:"We look forward to welcoming you to Casalaggiù.",notfound:"This link is not valid or has been cancelled. Write to us and we'll send you a new one.",down:"The payment service isn't responding. Please try again in a few minutes.",back:"Back to the website",privacy:"Privacy"},
de:{or:"oder",tr:"Banküberweisung",tr_scan:"Scannen Sie den Code mit Ihrer Banking-App: Betrag und Verwendungszweck sind bereits ausgefüllt.",tr_holder:"Kontoinhaber",tr_amount:"Betrag",tr_ref:"Verwendungszweck",copy:"Kopieren",copied:"Kopiert",tr_note:"Eine Überweisung kann 1–2 Werktage dauern: Wir bestätigen den Eingang.",loading:"Wird geladen…",pay:"Mit Karte bezahlen",secure:"Die Zahlung erfolgt auf der sicheren Seite von SumUp: Casalaggiù sieht Ihre Kartendaten nicht.",notdone:"Die Zahlung ist noch nicht abgeschlossen. Sie können es erneut versuchen.",paid:"Zahlung erhalten. Vielen Dank!",seeyou:"Wir freuen uns auf Sie in Casalaggiù.",notfound:"Dieser Link ist ungültig oder wurde storniert. Schreiben Sie uns, wir senden Ihnen einen neuen.",down:"Der Zahlungsdienst antwortet nicht. Bitte in einigen Minuten erneut versuchen.",back:"Zur Website",privacy:"Datenschutz"},
nl:{or:"of",tr:"Bankoverschrijving",tr_scan:"Scan de code met je bankapp: bedrag en omschrijving zijn al ingevuld.",tr_holder:"Rekeninghouder",tr_amount:"Bedrag",tr_ref:"Omschrijving",copy:"Kopiëren",copied:"Gekopieerd",tr_note:"Een overschrijving kan 1–2 werkdagen duren: we bevestigen wanneer hij binnen is.",loading:"Laden…",pay:"Betalen met kaart",secure:"De betaling gebeurt op de beveiligde pagina van SumUp: Casalaggiù ziet je kaartgegevens niet.",notdone:"De betaling is nog niet voltooid. Je kunt het opnieuw proberen.",paid:"Betaling ontvangen. Bedankt!",seeyou:"We verwelkomen je graag in Casalaggiù.",notfound:"Deze link is ongeldig of geannuleerd. Stuur ons een bericht, dan sturen we een nieuwe.",down:"De betaaldienst reageert niet. Probeer het over een paar minuten opnieuw.",back:"Terug naar de website",privacy:"Privacy"},
es:{or:"o",tr:"Transferencia bancaria",tr_scan:"Escanea el código con la app de tu banco: importe y concepto ya están rellenados.",tr_holder:"Titular",tr_amount:"Importe",tr_ref:"Concepto",copy:"Copiar",copied:"Copiado",tr_note:"La transferencia puede tardar 1–2 días laborables: te confirmamos cuando la recibamos.",loading:"Cargando…",pay:"Pagar con tarjeta",secure:"El pago se realiza en la página segura de SumUp: Casalaggiù no ve los datos de tu tarjeta.",notdone:"El pago aún no se ha completado. Puedes volver a intentarlo.",paid:"Pago recibido. ¡Gracias!",seeyou:"Te esperamos en Casalaggiù.",notfound:"Este enlace no es válido o se ha cancelado. Escríbenos y te enviamos uno nuevo.",down:"El servicio de pago no responde. Inténtalo de nuevo en unos minutos.",back:"Volver al sitio",privacy:"Privacidad"},
fr:{or:"ou",tr:"Virement bancaire",tr_scan:"Scannez le code avec l'application de votre banque : montant et motif sont déjà remplis.",tr_holder:"Titulaire",tr_amount:"Montant",tr_ref:"Motif",copy:"Copier",copied:"Copié",tr_note:"Un virement peut prendre 1 à 2 jours ouvrés : nous vous confirmerons sa réception.",loading:"Chargement…",pay:"Payer par carte",secure:"Le paiement se fait sur la page sécurisée de SumUp : Casalaggiù ne voit pas les données de votre carte.",notdone:"Le paiement n'est pas encore finalisé. Vous pouvez réessayer.",paid:"Paiement reçu. Merci !",seeyou:"Au plaisir de vous accueillir à Casalaggiù.",notfound:"Ce lien n'est pas valide ou a été annulé. Écrivez-nous et nous vous en enverrons un nouveau.",down:"Le service de paiement ne répond pas. Réessayez dans quelques minutes.",back:"Retour au site",privacy:"Confidentialité"}};
const $=id=>document.getElementById(id);
let lang="it";try{const s=localStorage.getItem("cdm_lang");if(s&&T[s])lang=s;else{const n=(navigator.language||"it").slice(0,2);if(T[n])lang=n}}catch(e){const n=(navigator.language||"it").slice(0,2);if(T[n])lang=n}
let data=null,errKey=null;
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(n=>n.textContent=T[lang][n.dataset.i]);
  const L=$("langs");L.innerHTML="";
  Object.keys(T).forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c.toUpperCase();b.setAttribute("aria-pressed",String(c===lang));b.onclick=()=>{lang=c;try{localStorage.setItem("cdm_lang",c)}catch(e){}render()};L.append(b)});
  if(errKey){$("loading").hidden=true;$("error").hidden=false;$("error").textContent=T[lang][errKey]}
  if(data){
    const eur=new Intl.NumberFormat(lang,{style:"currency",currency:"EUR"}).format(data.importo);
    $("loading").hidden=true;
    if(data.stato==="pagato"){$("paid").hidden=false;$("paiddesc").textContent=`${data.descrizione} · ${eur}`}
    else{$("pay").hidden=false;$("desc").textContent=data.descrizione;$("amount").textContent=eur;
      $("card").hidden=!data.url;if(data.url){$("go").href=data.url;$("go").textContent=`${T[lang].pay} · ${eur}`}
      const b=data.bonifico;$("bank").hidden=!b;$("or").hidden=!(b&&data.url);
      if(b){$("b_ben").textContent=b.beneficiario;$("b_iban").textContent=b.iban.replace(/(.{4})/g,"$1 ").trim();$("b_imp").textContent=eur;$("b_cau").textContent=b.causale;
        if(!$("qr").firstChild)try{$("qr").innerHTML=qrSvg(epcText(b.beneficiario,b.iban,data.importo,b.causale),{size:200})}catch(e){}}}
  }
}
async function start(){
  const q=new URLSearchParams(location.search),t=q.get("t")||"";
  if(!/^[a-f0-9]{16}$/.test(t)){errKey="notfound";return render()}
  try{
    const r=await fetch(`${API}?action=paga&t=${t}`,{cache:"no-store"});const d=await r.json();
    if(d.ok&&d.stato==="pagato")data=d;
    else if(d.ok&&d.stato==="da_pagare"&&(d.url||d.bonifico)){data=d;if(q.get("fatto"))$("retry").hidden=false}
    else if(d.errore==="non_trovato"||(d.ok&&d.stato==="annullato"))errKey="notfound";
    else errKey="down";
  }catch(e){errKey="down"}
  render();
}
document.addEventListener("click",async e=>{const c=e.target.closest(".cp");if(!c)return;const v=$(c.dataset.c).textContent.replace(c.dataset.c==="b_iban"?/\s+/g:/$^/,"");try{await navigator.clipboard.writeText(v);c.textContent=T[lang].copied}catch(err){}});
render();start();
</script>
</body>
</html>
