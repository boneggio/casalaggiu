<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#14233a;--muted:#5b6676;--line:#dfe1dc;--sun:#e0a12a;--ionio:#0f7b77;--busyink:#8b3d2c;--terra:#c66a3d;
--f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--surface:#16212f;--ink:#eef1f4;--muted:#9aa6b4;--line:#273444;--sun:#f0b84a;--ionio:#3fc1bb;--busyink:#f0a490;--terra:#f0a77c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding:24px 16px 60px}
main{max-width:720px;margin:0 auto;display:grid;gap:18px}
.head{text-align:center;display:grid;gap:8px}
.mark{width:72px;height:64px;margin:0 auto;color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--terra) 78%,var(--ink))}
.langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.stay{font-family:var(--f-mono);font-weight:600;text-align:center}
.muted{color:var(--muted);font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid .full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:13px;font-weight:600;position:relative}
input,select{font:inherit;font-size:16px;font-weight:400;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--sun);outline-offset:1px}
.bad input,.bad select{border-color:var(--busyink);box-shadow:0 0 0 1px var(--busyink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:15px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;background:var(--bg)}
.seg input{width:auto;min-height:0;accent-color:var(--sun)}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;margin:2px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgb(0 0 0 / .12);max-height:240px;overflow:auto}
.sug li{padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:400;font-size:15px}
.sug li:hover,.sug li.on{background:var(--bg)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ionio)}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;background:var(--sun);color:#1b1404;border-radius:999px;padding:14px 22px;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--busyink);font-weight:600;margin:0}
.ok{color:var(--ionio);font-weight:700;font-size:22px;margin:0;text-align:center}
.priv{font-size:13px;color:var(--muted);margin:0}
</style>
</head>

  <p id="loading" class="muted" style="text-align:center" data-i="loading"></p>
  <p id="fail" class="err" style="text-align:center" hidden></p>
  <form id="f" hidden novalidate>
    <div class="card">
      <div class="stay" id="stay"></div>
      <p class="muted" id="intro"></p>
      <p class="muted" id="already" hidden data-i="already"></p>
      <div class="grid">
        <label><span data-i="howmany"></span><select id="n"></select></label>
        <div id="tipobox"><span style="font-size:13px;font-weight:600" data-i="travel"></span>

        </div>
      </div>
    </div>
    <div id="guests" style="display:grid;gap:18px;margin-top:18px"></div>
    <div class="card" style="margin-top:18px">
      <p class="priv" data-i="privacy"></p>
      <p class="err" id="msg" hidden></p>
      <button class="btn" id="send" type="submit" data-i="send"></button>
    </div>
  </form>
  <div class="card" id="done" hidden style="text-align:center">
    <p class="ok" data-i="thanks"></p>
    <p class="muted" data-i="thanks2"></p>
    <p class="muted"><a href="https://casalaggiu.it" style="color:inherit">casalaggiu.it</a></p>
  </div>

const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="text")e.textContent=v;else if(v!=null)e.setAttribute(k,v)}for(const k of kids)if(k!=null)e.append(k);return e};
const tok=new URLSearchParams(location.search).get("t")||"";
let lang=(()=>{const q=new URLSearchParams(location.search).get("l");if(LANGS.includes(q))return q;const n=(navigator.language||"it").slice(0,2);return LANGS.includes(n)?n:"it"})();
const t=k=>(T[lang]||T.it)[k];
let INFO=null,STATI=[],DOCS=[],COMUNI=null,comuniP=null,STATE=[];
// nomi degli stati nella lingua dell'ospite: l'elenco ufficiale è in italiano, lo abbiniamo ai codici ISO
const FIX={"STATI UNITI D'AMERICA":"US","FEDERAZIONE RUSSA":"RU","REPUBBLICA CECA":"CZ","REPUBBLICA SLOVACCA":"SK","COREA DEL SUD":"KR","COREA DEL NORD":"KP","SRI LANKA (CEYLON)":"LK","MACEDONIA DEL NORD":"MK","BOSNIA ED ERZEGOVINA":"BA","STATO DELLA CITTA' DEL VATICANO":"VA","MYANMAR-BIRMANIA":"MM","REPUBBLICA DOMINICANA":"DO","REPUBBLICA DEMOCRATICA DEL CONGO":"CD","CONGO":"CG","PAPUASIA-N.GUINEA":"PG","COSTA D'AVORIO":"CI","SAO TOME' E PRINCIPE":"ST","PERU'":"PE","S. CHRISTOPHER E NEVIS":"KN","SAINT VINCENT E GRENADINE":"VC","BIELORUSSIA":"BY","MOLDAVIA":"MD","SWAZILAND":"SZ","CAPO VERDE":"CV","REGNO UNITO":"GB","PAESI BASSI":"NL","TAIWAN":"TW","PALESTINA":"PS","KOSOVO":"XK","HONG KONG":"HK","MACAO":"MO","ISOLE VERGINI":"VI","VERGINI BRITANNICHE (ISOLE)":"VG","CAYMAN (ISOLE)":"KY","FAER OER":"FO","LA REUNION":"RE","TIMOR":"TL","MICRONESIA STATI FEDERALI":"FM","PALAU REPUBBLICA":"PW","MALVINE":"FK","MAN":"IM","TURKS":"TC","WALLIS":"WF","GUAYANA FRANCESE":"GF","POLINESIA":"PF","NUOVA CALEDONIA":"NC","SANT ELENA":"SH","SAHARA SPAGNOLO":"EH","APOLIDE":null};
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z]/g,"");
let ISO={};
function buildIso(){try{const dn=new Intl.DisplayNames(["it"],{type:"region"}),m={};for(let a=65;a<91;a++)for(let b=65;b<91;b++){const c=String.fromCharCode(a,b),n=dn.of(c);if(n&&n!==c)m[norm(n)]=c}STATI.forEach(([code,name])=>{ISO[code]=name in FIX?FIX[name]:m[norm(name)]||null})}catch(e){}}
function statoNome(code,name){const iso=ISO[code];if(iso&&lang!=="it"){try{const n=new Intl.DisplayNames([lang],{type:"region"}).of(iso);if(n&&n!==iso)return n}catch(e){}}return name.charAt(0)+name.slice(1).toLowerCase().replace(/(^|[\s'(-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())}
const TOP=[ITALIA,"100000216","100000232","100000215","100000239","100000219","100000206","100000241","100000203","100000536"];
function statoSelect(val){const s=el("select");s.append(el("option",{value:"",text:t("choose")}));
  const items=STATI.map(([c,n])=>[c,statoNome(c,n)]).sort((a,b)=>a[1].localeCompare(b[1],lang));
  const g1=el("optgroup",{label:"★"});TOP.forEach(c=>{const x=items.find(i=>i[0]===c);if(x)g1.append(el("option",{value:x[0],text:x[1]}))});
  const g2=el("optgroup",{label:"A–Z"});items.forEach(([c,n])=>g2.append(el("option",{value:c,text:n})));s.append(g1,g2);if(val)s.value=val;return s}
const DOC_TOP=["IDENT","IDELE","PASOR","PATEN"];
const DOC_LBL={it:{IDENT:"Carta d'identità",IDELE:"Carta d'identità elettronica",PASOR:"Passaporto",PATEN:"Patente di guida"},en:{IDENT:"Identity card",IDELE:"Electronic identity card",PASOR:"Passport",PATEN:"Driving licence"},de:{IDENT:"Personalausweis",IDELE:"Elektronischer Personalausweis",PASOR:"Reisepass",PATEN:"Führerschein"},nl:{IDENT:"Identiteitskaart",IDELE:"Elektronische identiteitskaart",PASOR:"Paspoort",PATEN:"Rijbewijs"},es:{IDENT:"Documento de identidad",IDELE:"Documento de identidad electrónico",PASOR:"Pasaporte",PATEN:"Permiso de conducir"},fr:{IDENT:"Carte d'identité",IDELE:"Carte d'identité électronique",PASOR:"Passeport",PATEN:"Permis de conduire"}};
function docSelect(val){const s=el("select");s.append(el("option",{value:"",text:t("choose")}));DOC_TOP.forEach(c=>s.append(el("option",{value:c,text:DOC_LBL[lang][c]})));
  const g=el("optgroup",{label:t("other")});DOCS.filter(([c])=>!DOC_TOP.includes(c)).forEach(([c,n])=>g.append(el("option",{value:c,text:n})));s.append(g);if(val)s.value=val;return s}
async function loadComuni(){if(COMUNI)return COMUNI;if(!comuniP)comuniP=fetch(API+"?action=comuni").then(r=>{if(!r.ok)throw 0;return r.text()}).then(tx=>{COMUNI=tx.split("\n").filter(Boolean).map(l=>{const[c,n,p]=l.split("|");return{c,n,p,k:norm(n)}});return COMUNI});return comuniP}
function comuneInput(val,lbl){
  const wrap=el("label",{},el("span",{text:lbl}));const inp=el("input",{autocomplete:"off",placeholder:t("type"),spellcheck:"false"});const ul=el("ul",{class:"sug",hidden:""});wrap.append(inp,ul);
  wrap.dataset.code=val&&val.c||"";if(val&&val.c){inp.value=`${val.n} (${val.p})`;wrap.dataset.n=val.n;wrap.dataset.p=val.p}
  let on=-1,list=[];
  const show=()=>{ul.innerHTML="";list.forEach((x,i)=>{const li=el("li",{class:i===on?"on":null,text:`${x.n} (${x.p})`});li.onmousedown=e=>{e.preventDefault();pick(x)};ul.append(li)});ul.hidden=!list.length};
  const pick=x=>{wrap.dataset.code=x.c;wrap.dataset.n=x.n;wrap.dataset.p=x.p;inp.value=`${x.n} (${x.p})`;list=[];show();wrap.classList.remove("bad")};
  inp.addEventListener("input",async()=>{wrap.dataset.code="";const q=norm(inp.value);if(q.length<2){list=[];show();return}const C=await loadComuni();list=C.filter(x=>x.k.startsWith(q)).concat(C.filter(x=>!x.k.startsWith(q)&&x.k.includes(q))).slice(0,8);on=-1;show()});
  inp.addEventListener("keydown",e=>{if(ul.hidden)return;if(e.key==="ArrowDown"){on=Math.min(on+1,list.length-1);show();e.preventDefault()}if(e.key==="ArrowUp"){on=Math.max(on-1,0);show();e.preventDefault()}if(e.key==="Enter"&&on>=0){pick(list[on]);e.preventDefault()}});
  inp.addEventListener("blur",()=>setTimeout(()=>{ul.hidden=true},150));
  return wrap}
function field(lbl,ctrl,cls){return el("label",{class:cls||null},el("span",{text:lbl}),ctrl)}
function readGuests(){return [...document.querySelectorAll(".guest")].map((g,i)=>{const v=k=>{const x=g.querySelector(`[data-k="${k}"]`);if(!x)return"";return x.dataset.code!==undefined&&x.tagName==="LABEL"?x.dataset.code:(x.querySelector("input,select")||x).value};
  const o={cognome:v("cognome"),nome:v("nome"),sesso:(g.querySelector(`input[name="s${i}"]:checked`)||{}).value||"",nascita:v("nascita"),statoNascita:v("statoNascita"),comuneNascita:v("comuneNascita"),cittadinanza:v("cittadinanza"),statoRes:v("statoRes"),comuneRes:v("comuneRes")};
  if(i===0)Object.assign(o,{docTipo:v("docTipo"),docNumero:v("docNumero"),docStato:v("docStato"),docComune:v("docComune"),cf:v("cf")});
  g.querySelectorAll("label[data-code]").forEach(x=>{if(x.dataset.code)o[x.dataset.k+"_o"]={c:x.dataset.code,n:x.dataset.n,p:x.dataset.p}});return o})}
function guestCard(i,o={}){
  const g=el("div",{class:"card guest"});
  g.append(el("div",{class:"gh"},el("h2",{text:t("guest")(i)}),i===0?el("span",{class:"tag",text:"ID"}):null));
  if(i===0)g.append(el("p",{class:"muted",text:t("lead")}));
  const grid=el("div",{class:"grid"});
  const inp=(k,type="text",extra={})=>{const x=el("input",{type,...extra});x.value=o[k]||"";const l=field(t(k),x);l.dataset.k=k;return l};
  const sel=(k,s)=>{const l=field(t(k),s);l.dataset.k=k;return l};
  grid.append(inp("cognome","text",{autocomplete:i===0?"family-name":"off"}),inp("nome","text",{autocomplete:i===0?"given-name":"off"}));
  const sx=el("div",{"data-k":"sesso"},el("span",{style:"font-size:13px;font-weight:600",text:t("sesso")}),el("div",{class:"seg",style:"margin-top:4px"},
    el("label",{},el("input",{type:"radio",name:"s"+i,value:"M"}),el("span",{text:t("M")})),el("label",{},el("input",{type:"radio",name:"s"+i,value:"F"}),el("span",{text:t("F")}))));
  if(o.sesso)setTimeout(()=>{const r=sx.querySelector(`input[value="${o.sesso}"]`);if(r)r.checked=true});
  grid.append(sx,inp("nascita","date",{max:new Date().toISOString().slice(0,10)}));
  const dyn=(stK,coK,lblK)=>{const s=statoSelect(o[stK]||"");const st=sel(stK,s);const co=comuneInput(o[coK+"_o"],t(lblK));co.dataset.k=coK;const up=()=>{co.hidden=s.value!==ITALIA;if(!co.hidden)loadComuni().catch(()=>{})};s.addEventListener("change",up);up();return[st,co]};
  grid.append(...dyn("statoNascita","comuneNascita","comuneNascita"));
  grid.append(sel("cittadinanza",statoSelect(o.cittadinanza||"")));
  grid.append(...dyn("statoRes","comuneRes","comuneRes"));
  if(i===0){grid.append(sel("docTipo",docSelect(o.docTipo||"")),inp("docNumero","text",{autocomplete:"off",style:"text-transform:uppercase"}));grid.append(...dyn("docStato","docComune","docComune"));
    const cf=inp("cf","text",{autocomplete:"off",spellcheck:"false",maxlength:"16",style:"text-transform:uppercase"});if(!o.cf&&INFO&&INFO.cf)cf.querySelector("input").value=INFO.cf;cf.append(el("small",{class:"muted",style:"font-size:12px;font-weight:400",text:t("cfnote")}));grid.append(cf)}
  g.append(grid);return g}
function renderGuests(keep){const n=+$("n").value;const old=keep?readGuests():[];const G=$("guests");G.innerHTML="";for(let i=0;i<n;i++)G.append(guestCard(i,old[i]||{}));$("tipobox").hidden=n<2}
function renderLangs(){const L=$("langs");L.innerHTML="";LANGS.forEach(l=>{const b=el("button",{type:"button","aria-pressed":String(l===lang),text:l.toUpperCase()});b.onclick=()=>{lang=l;document.documentElement.lang=l;render(true)};L.append(b)})}
function render(keep){renderLangs();document.querySelectorAll("[data-i]").forEach(e=>{const v=t(e.dataset.i);if(typeof v==="string")e.textContent=v});document.title="Casalaggiù · "+t("title");
  if(!INFO)return;const loc=lang==="en"?"en-GB":lang;const d=x=>new Date(x+"T12:00:00").toLocaleDateString(loc,{weekday:"short",day:"numeric",month:"long",year:"numeric"});
  $("stay").textContent=`${d(INFO.arrivo)} → ${d(INFO.partenza)}`;$("intro").textContent=t("intro")(INFO.nome||"");$("already").hidden=!INFO.compilato;
  const n=$("n"),cur=n.value||String(INFO.ospiti);n.innerHTML="";for(let i=1;i<=Math.max(INFO.ospiti,1);i++)n.append(el("option",{value:i,text:i===1?t("n1"):t("nn")(i)}));n.value=cur;renderGuests(keep)}
function showErr(m){$("msg").textContent=m;$("msg").hidden=!m}
$("n").onchange=()=>renderGuests(true);
$("f").addEventListener("submit",async e=>{e.preventDefault();showErr("");document.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));
  const ospiti=readGuests();
  // controllo veloce prima dell'invio: comune scelto dall'elenco quando lo stato è l'Italia
  for(let i=0;i<ospiti.length;i++){const o=ospiti[i],g=document.querySelectorAll(".guest")[i];for(const[st,co]of[["statoNascita","comuneNascita"],["statoRes","comuneRes"],["docStato","docComune"]]){if(o[st]===ITALIA&&!o[co]){const x=g.querySelector(`[data-k="${co}"]`);if(x){x.classList.add("bad");x.scrollIntoView({behavior:"smooth",block:"center"});showErr(t("e_pick"));return}}}}
  $("send").disabled=true;$("send").textContent=t("sending");
  try{const r=await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"checkin_invia",t:tok,cf:(ospiti[0]&&ospiti[0].cf)||"",tipo:(document.querySelector('input[name="tipo"]:checked')||{}).value,ospiti:ospiti.map(o=>Object.fromEntries(Object.entries(o).filter(([k])=>!k.endsWith("_o")&&k!=="cf")))})})).json();
    if(r.ok){$("f").hidden=true;$("done").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}
    else if(r.errore==="campo"){const g=document.querySelectorAll(".guest")[r.ospite];const k=r.campo==="maggiorenne"?"nascita":r.campo;const x=g&&g.querySelector(`[data-k="${k}"]`);if(x){x.classList.add("bad");x.scrollIntoView({behavior:"smooth",block:"center"})}showErr(r.campo==="maggiorenne"?t("e_maggiorenne"):t("e_campo"))}
    else showErr(r.errore==="tabelle"?t("nettab"):r.errore==="scaduto"?t("expired"):t("e_net"))}
  catch(err){showErr(t("e_net"))}
  $("send").disabled=false;$("send").textContent=t("send")});
(async()=>{render();
  try{const r=await(await fetch(API+"?action=checkin&t="+encodeURIComponent(tok))).json();
    if(!r.ok){$("loading").hidden=true;$("fail").hidden=false;$("fail").textContent=t("notfound");return}
    if(!new URLSearchParams(location.search).get("l")&&LANGS.includes(r.lingua))lang=r.lingua;
    if(r.scaduto){$("loading").hidden=true;render();$("fail").hidden=false;$("fail").textContent=t("expired");return}
    const tb=await(await fetch(API+"?action=tabelle")).json();if(!tb.ok)throw 0;STATI=tb.stati;DOCS=tb.documenti;buildIso();
    INFO=r;$("loading").hidden=true;$("f").hidden=false;render()}
  catch(e){$("loading").hidden=true;$("fail").hidden=false;$("fail").textContent=t("nettab")}})();
