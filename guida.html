<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#14233a;--muted:#5b6676;--line:#dfe1dc;--sun:#e0a12a;--ionio:#138a86;--busyink:#8b3d2c;--terra:#c66a3d;--wa:#1f9d55;
--f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--surface:#16212f;--ink:#eef1f4;--muted:#9aa6b4;--line:#273444;--sun:#f0b84a;--ionio:#3fc1bb;--busyink:#f0a490;--terra:#f0a77c;--wa:#2fbf6c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding:24px 16px 60px}
main{max-width:720px;margin:0 auto;display:grid;gap:16px}
.head{text-align:center;display:grid;gap:8px}
.mark{width:72px;height:64px;margin:0 auto;color:var(--ink)}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;line-height:1.1}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--terra) 78%,var(--ink))}
.rainbow{height:3px;width:120px;margin:4px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--terra),var(--sun),var(--ionio))}
.langs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:3px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;display:flex;gap:10px;align-items:center}
.card h2 .ico{font-size:22px;line-height:1}
.muted{color:var(--muted);font-size:14px;margin:0}
.hello{font-family:var(--f-display);font-size:22px;margin:0;text-align:center}
.stay{font-family:var(--f-mono);font-weight:600;text-align:center;font-size:14px;color:var(--muted)}
.prev{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-color:var(--sun);text-align:center;font-weight:600;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:600px){.quick{grid-template-columns:1fr}}
.kv{display:grid;gap:2px}.kv span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-size:18px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;background:var(--sun);color:#1b1404;border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}.btn.tg{background:#2a9fd8;color:#fff}
.btn.big{width:100%;justify-content:center;font-size:17px;padding:14px 22px}
.qr{background:#fff;border-radius:12px;padding:10px;justify-self:center}.qr svg{display:block;width:180px;height:180px}
.chips{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;border-radius:999px;padding:6px 12px;white-space:nowrap}
.txt p{margin:0 0 10px}.txt p:last-child,.txt ul:last-child{margin-bottom:0}
.txt ul{margin:0 0 10px;padding-left:20px}.txt li{margin:2px 0}
.txt a{color:var(--ionio);word-break:break-word}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.links{grid-template-columns:1fr}}
.links a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;background:var(--bg)}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input{font:inherit;font-size:24px;letter-spacing:.3em;text-align:center;font-family:var(--f-mono);width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);min-height:52px}
input:focus{outline:2px solid var(--sun);outline-offset:1px}
.err{color:var(--busyink);font-weight:600;margin:0;text-align:center}
.foot{text-align:center}.foot a{color:inherit}
</style>
</head>

    if(w.pass){const cp=el("button",{class:"btn",type:"button",text:t.copy});cp.onclick=async()=>{try{await navigator.clipboard.writeText(w.pass);cp.textContent=t.copied}catch(e){const r=document.createRange();r.selectNodeContents($("wpass"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};row.append(cp)}
    let qrb=null;if(w.rete&&window.qrSvg){qrb=el("div",{hidden:""},el("div",{class:"qr",html:qrSvg(`WIFI:T:${w.pass?"WPA":"nopass"};S:${wifiEsc(w.rete)};${w.pass?"P:"+wifiEsc(w.pass)+";":""};`,{size:180})}),el("p",{class:"muted",style:"text-align:center;margin-top:6px",text:t.wQrH}));
      const qb=el("button",{class:"btn ghost",type:"button",text:t.wQr});qb.onclick=()=>{qrb.hidden=!qrb.hidden};row.append(qb)}
    c.append(row);if(qrb)c.append(qrb);Q.append(c)}
  const wa=String(D.whatsapp||"").replace(/\D/g,""),tg=String(D.telegram||"").replace(/[^A-Za-z0-9_]/g,"");
  if(wa.length>=8||tg){const num="+"+wa,row=el("div",{class:"row"});

}
function show(which){["loading","fail","pinf","g"].forEach(id=>$(id).hidden=id!==which)}
async function get(q){const r=await fetch(API+"?action=guida&"+q,{cache:"no-store"});return r.json()}
function apply(r){D=r;if(!P.get("l")&&LANGS.includes(r.lingua)&&!st.get("cdm_lang"))lang=r.lingua;FAIL=null;show("g");render()}
function fail(code,r){D=r||null;FAIL=code;show("fail");render()}
async function start(){
  render();
  try{
    if(ak){const r=await get("a="+encodeURIComponent(ak));return r.ok?apply(r):fail("notfound")}
    if(tok){const r=await get("t="+encodeURIComponent(tok));if(r.ok)return apply(r);
      if(r.lingua&&!P.get("l")&&LANGS.includes(r.lingua)&&!st.get("cdm_lang"))lang=r.lingua;
      return fail(r.errore==="presto"?"presto":r.errore==="scaduto"?"expired":r.errore==="non_pronta"?"notready":"notfound",r)}
    const k=st.get("cg_guida_k");
    if(k){const r=await get("k="+encodeURIComponent(k));if(r.ok)return apply(r);if(r.errore==="non_pronta")return fail("notready");st.set("cg_guida_k",null)}
    show("pinf");setTimeout(()=>$("pin").focus(),50);
  }catch(e){fail("net")}
}
$("pinf").onsubmit=async e=>{e.preventDefault();const t=T[lang],m=$("pinmsg"),b=$("pingo");m.hidden=true;b.disabled=true;
  try{const r=await(await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"guida_pin",pin:$("pin").value})})).json();
    if(r.ok){st.set("cg_guida_k",r.k);const g=await get("k="+r.k);if(g.ok)apply(g);else fail(g.errore==="non_pronta"?"notready":"notfound")}
    else if(r.errore==="non_pronta")fail("notready");
    else{m.textContent=r.errore==="troppe"?t.many:t.pinBad;m.hidden=false;$("pin").select()}
  }catch(err){m.textContent=t.net;m.hidden=false}
  b.disabled=false};
start();
</script>
